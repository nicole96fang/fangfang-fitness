<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4ba7ca">
<title>🥀努力减肥的肥芳</title>
<style>
:root{--blue:#4ba7ca;--pink:#ffb6c1;--ink:#31576b;--bg:#f7fcfe;--card:#fff;--line:#d9edf5;--shadow:0 10px 28px rgba(75,167,202,.14);--r:24px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fdff,#fff7fa)}
body{overflow-x:hidden}.app{min-height:100vh}.snow{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.flake{position:absolute;top:-20px;color:#fff;font-size:14px;opacity:.8;animation:fall linear infinite}@keyframes fall{to{transform:translate3d(50px,110vh,0) rotate(360deg)}} 
.top{position:sticky;top:0;z-index:20;padding:14px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{font-size:28px}.brand{font-weight:900;font-size:18px;line-height:1.1}.sub{font-size:11px;color:#77a0b1}.menu{margin-left:auto;border:0;background:#eaf8fc;color:var(--blue);width:44px;height:44px;border-radius:16px;font-size:22px}
.layout{display:flex;max-width:1180px;margin:auto}.side{width:250px;padding:18px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.nav{display:grid;gap:9px}.nav button{border:0;background:transparent;text-align:left;padding:14px 16px;border-radius:18px;color:#577a8c;font-size:15px;font-weight:800;cursor:pointer}.nav button.active{background:linear-gradient(135deg,var(--blue),#71c3df);color:white;box-shadow:var(--shadow)}.main{flex:1;padding:18px 18px 110px;min-width:0}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#e8f8fc,#fff0f4);border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#7194a3}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.card h2,.card h3{margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:20px;background:#f4fbfd;border:1px solid var(--line)}.stat b{display:block;font-size:22px}.label{font-size:12px;color:#7695a2}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #cfe7f0;border-radius:16px;background:#fbfeff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #4ba7ca22}.btn{border:0;border-radius:18px;padding:13px 17px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}.btn.pink{background:var(--pink);color:#704c57}.btn.light{background:#edf9fc;color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.barwrap{display:flex;align-items:flex-end;gap:7px;height:180px;padding:12px 4px;border-bottom:1px solid var(--line)}.barcol{flex:1;min-width:22px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:38px;background:linear-gradient(#4ba7ca,#8dd2e7);border-radius:10px 10px 3px 3px;min-height:5px}.barcol small{font-size:9px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{aspect-ratio:1;border-radius:17px;overflow:hidden;background:#eef8fb;border:1px dashed #b8dce8;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo span{position:absolute;bottom:5px;left:6px;background:#ffffffdd;border-radius:9px;padding:2px 6px;font-size:10px}.video-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.video{border:1px solid var(--line);border-radius:20px;padding:15px;background:#fbfeff}.video .thumb{height:100px;border-radius:16px;background:linear-gradient(135deg,#dff5fb,#ffe7ed);display:grid;place-items:center;font-size:36px;margin-bottom:10px}.video h3{font-size:15px;margin:0 0 8px}.video a{display:inline-block;color:var(--blue);font-weight:800;text-decoration:none}.check{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;margin:8px 0;background:#fcfeff}.check input{width:20px;height:20px;accent-color:var(--blue)}.history{display:grid;gap:9px}.hist{padding:12px 14px;border-radius:16px;background:#f7fcfe;border:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ffe8ee;color:#9b6371;font-size:11px;font-weight:900}.bottom{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#31576b;color:#fff;padding:12px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#17374766;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;border-radius:28px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.close{float:right;border:0;background:#eef8fb;border-radius:14px;padding:9px 12px}.safe{background:#fff7e7;border:1px solid #f1dca9;color:#7c6335;border-radius:18px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.6}
@media(max-width:820px){.side{display:none}.main{padding:12px 12px 95px}.grid,.video-list{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:none;color:#71909e;font-size:10px;font-weight:800;padding:7px 2px;border-radius:14px}.bottom button.active{background:#eaf8fc;color:var(--blue)}.bottom span{display:block;font-size:18px;margin-bottom:2px}.photo-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="app">
<header class="top"><div class="logo">🥀</div><div><div class="brand">努力减肥的肥芳</div><div class="sub">MY LITTLE FITNESS JOURNAL</div></div><button class="menu" id="menu">☰</button></header>
<div class="layout">
<aside class="side"><div class="nav" id="sideNav"></div></aside>
<main class="main" id="main"></main>
</div>
<nav class="bottom" id="bottomNav"></nav>
</div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='fangfangFitness_v1', DB='fangfangPhotoDB', STORE='photos';
const nav=[['home','🏠','首页'],['weight','⚖️','体重记录'],['fasting','🥀','轻断食'],['water','💧','饮水记录'],['exercise','🏃🏻‍♀️','运动记录'],['food','🥗','饮食记录']];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{profile:{nickname:'肥芳',height:'',initialWeight:'',targetWeight:''},weights:[],water:[],exercise:{},meal:{},history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function today(){return new Date().toISOString().slice(0,10)}
function bmi(){let h=+data.profile.height,w=+data.profile.initialWeight;return h&&w?(w/((h/100)**2)).toFixed(1):'—'}
function page(id){location.hash=id}
function current(){return location.hash.replace('#','')||'home'}
function renderNav(){const s=document.getElementById('sideNav'),b=document.getElementById('bottomNav');s.innerHTML='';b.innerHTML='';nav.forEach(([id,ic,t])=>{let x=document.createElement('button');x.textContent=ic+'  '+t;x.className=current()==id?'active':'';x.onclick=()=>page(id);s.appendChild(x);let y=document.createElement('button');y.innerHTML='<span>'+ic+'</span>'+t;y.className=current()==id?'active':'';y.onclick=()=>page(id);b.appendChild(y)})}
function render(){renderNav();let id=current(),m=document.getElementById('main');m.innerHTML=pages[id]();if(id==='weight')drawChart();attach();}
function pages(id){return ({home:homePage,weight:weightPage,fasting:fastingPage,water:waterPage,exercise:exercisePage,food:foodPage}[id]||homePage)()}
function homePage(){return `<section class="page active"><div class="hero"><h1>🥀 今天也要为自己努力一点</h1><p>把体重、喝水、运动和饮食记录下来，让变化看得见。</p></div><div class="stats"><div class="stat"><span class="label">初始体重</span><b>${data.profile.initialWeight||'—'} <small>kg</small></b></div><div class="stat"><span class="label">目标体重</span><b>${data.profile.targetWeight||'—'} <small>kg</small></b></div><div class="stat"><span class="label">今日体重</span><b>${latestWeight()||'—'} <small>kg</small></b></div><div class="stat"><span class="label">BMI</span><b>${bmi()}</b></div></div><div class="grid" style="margin-top:14px"><div class="card"><h3>🌷 今日进度</h3><p>饮水 ${waterToday()} 杯 · 运动 ${exerciseToday()} 项 · 打卡 ${mealToday()} 项</p><div class="actions"><button class="btn" onclick="page('weight')">记录体重</button><button class="btn pink" onclick="page('water')">喝水打卡</button></div></div><div class="card"><h3>💗 小提醒</h3><p>体重每天的自然波动很正常。关注长期趋势，比单日数字更重要。</p></div></div><div class="card"><h3>📚 本地保存状态</h3><p>资料、记录、打卡和照片均保存在本机；无需后端、无广告、刷新页面不会清空。</p></div></section>`}
function weightPage(){return `<section class="page active"><div class="hero"><h1>⚖️ 体重记录</h1><p>记录趋势，不追逐一天的数字。</p></div><div class="card"><h2>个人资料</h2><div class="formgrid"><div class="field"><label>昵称</label><input id="nickname" value="${esc(data.profile.nickname)}"></div><div class="field"><label>身高（cm）</label><input id="height" type="number" value="${data.profile.height}"></div><div class="field"><label>初始体重（kg）</label><input id="initialWeight" type="number" step="0.1" value="${data.profile.initialWeight}"></div><div class="field"><label>目标体重（kg）</label><input id="targetWeight" type="number" step="0.1" value="${data.profile.targetWeight}"></div></div><div class="actions"><button class="btn" onclick="saveProfile()">保存资料</button><span class="pill">BMI：${bmi()}</span></div></div>
<div class="card"><h2>今日体重</h2><div class="formgrid"><div class="field"><label>日期</label><input id="wdate" type="date" value="${today()}"></div><div class="field"><label>当日体重（kg）</label><input id="wval" type="number" step="0.1"></div></div><div class="actions"><button class="btn" onclick="addWeight()">保存今日体重</button><label class="btn light">📷 上传今日照片<input id="wphoto" type="file" accept="image/*" capture="user" hidden></label></div></div>
<div class="card"><h2>📈 体重趋势</h2><div class="barwrap" id="chart"></div><p style="font-size:12px;color:#7895a2">已瘦：<b>${lostKg()}</b> kg</p></div>
<div class="card"><h2>📸 每日照片</h2><div class="photo-grid" id="weightPhotos"></div></div>
<div class="card"><h2>🕰️ History</h2><div class="history">${data.weights.slice().reverse().map(x=>`<div class="hist"><span>${x.date}</span><b>${x.weight} kg</b></div>`).join('')||'<p>还没有记录。</p>'}</div></div></section>`}
function waterPage(){let cups=data.water.filter(x=>x.date===today());return `<section class="page active"><div class="hero"><h1>💧 饮水记录</h1><p>记录今天喝了几杯，也记录饮料种类。</p></div><div class="card"><h2>今天：${cups.length} 杯</h2><div class="actions">${['温水','汽水','白咖啡冰','冰拿铁','黑咖啡','绿茶','牛奶','有糖饮料','柠檬水'].map(x=>`<button class="btn light" onclick="addDrink('${x}')">${x}</button>`).join('')}</div></div><div class="card"><h2>今日记录</h2><div class="history">${cups.map((x,i)=>`<div class="hist"><span>${i+1}. ${x.kind}</span><b>💧 1 杯</b></div>`).join('')||'<p>今天还没有饮水记录。</p>'}</div></div></section>`}
const vids=[
['每日运动 01','https://youtu.be/PXnUli_4dxU?si=v8RW1h5ozryPsc5G'],['每日运动 02','https://youtu.be/Ammb_7sv_KA?si=oEstmdqa4GS63j_L'],['每日运动 03',''],['每日运动 04','https://youtu.be/lnsEnVuSva8?si=NujrqxK1RSAfqa64'],['每日运动 05','https://youtu.be/9ILvgLzjpyw?si=Krrb6DfLffoJNQc9'],['每日运动 06','https://youtu.be/MEFA8YnsCj0?si=JYUlqn36q-0rJPU6'],['每日运动 07','https://youtu.be/uHLxiiTwJQk?si=I6aj04xLZ4O9TrmO'],['每日运动 08','https://youtu.be/mNAQBAD_lTo?si=s1mH80O29hx0NNw3'],['每日运动 09','https://youtu.be/vHVZ2sWwmRg?si=OvEL_IyHReK4Js65'],['每日运动 10','https://youtu.be/Ft_LrEEK9yw?si=Mvz1H0W1aCLBWS1B'],['每日运动 11','https://youtu.be/EVgtE8XVoto?si=ZRPTunDfAeFs1FRv'],['每日运动 12','https://youtu.be/1tbeXsjHMV4?si=-QC-v-KYBxOa6gIM'],['每日运动 13','https://youtu.be/4kzKY-f-8Rw?si=if1zKzsbs9SQPqQm'],['每日运动 14','https://youtu.be/ehQnuhRruso?si=A4C9YjrUOAULPcnu'],['每日运动 15','https://youtu.be/47JDs83rdlI?si=n5WxOsnJ_WnHbNBP'],['每日运动 16','https://youtu.be/3_oGMJeWQNo?si=LaIPu6XMw02Z5H1K'],['每日运动 17','https://youtu.be/_m4ZbflEEhc?si=n1Rdw7RBdcYTZOYd']];
function exercisePage(){return `<section class="page active"><div class="hero"><h1>🏃🏻‍♀️ 每日运动</h1><p>点击任意运动进入独立打卡页；完成后会自动记录日期。</p></div><div class="video-list">${vids.map((v,i)=>`<div class="video"><div class="thumb">🥀</div><h3>${v[0]}</h3><p class="label">${data.exercise[i]?.date===today()?'今日已完成 ✓':'今日未完成'}</p><button class="btn" onclick="openExercise(${i})">${v[1]?'打开运动页':'补充视频链接'}</button></div>`).join('')}</div></section>`}
function fastingPage(){return `<section class="page active"><div class="hero"><h1>🥀 轻断食打卡</h1><p>建议优先选择均衡、可持续的饮食方式；极端断食并不适合所有人。</p></div><div class="safe"><b>健康提醒：</b>你提供的部分计划包含长时间只喝液体、单一食物或极低摄入。这里仅把它做成“自定义记录模板”，不会把它标记为安全减肥方案。若有慢性病、怀孕/备孕、进食障碍史或正在用药，请先咨询医生/营养师。</div><div class="card"><h2>📋 3 天记录模板</h2>${['第一天','第二天','第三天'].map((d,i)=>mealDayCard(d,i+1,['早餐：黑咖啡/鸡蛋','午餐：玉米/鸡蛋/牛奶','晚餐：水果或蔬菜'][0])).join('')}</div><div class="card"><h2>🌷 我的长期打卡</h2><p>可以把你的 21 天计划逐天记录。每一项都支持完成打卡和照片，并自动保留 history。</p><div class="actions"><button class="btn" onclick="openCustomPlan()">开始 21 天记录</button></div></div><div class="card"><h2>🕰️ History</h2><div class="history">${data.history.slice().reverse().map(h=>`<div class="hist"><span>${h.date} · Day ${h.day}</span><b>${h.type}</b></div>`).join('')||'<p>暂无打卡历史。</p>'}</div></div></section>`}
function mealDayCard(label,day,desc){let key='fast3-'+day,done=data.meal[key]?.done;return `<div class="check"><input type="checkbox" ${done?'checked':''} onchange="toggleMeal('${key}',${day},this.checked)"><div><b>${label}</b><div class="label">${desc}</div><label class="btn light" style="display:inline-block;margin-top:7px">📷 上传照片<input type="file" accept="image/*" hidden onchange="saveMealPhoto('${key}',this.files[0])"></label></div></div>`}
function foodPage(){return `<section class="page active"><div class="hero"><h1>🥗 饮食记录</h1><p>建立自己的减脂食谱收藏，优先选择蛋白质、蔬菜、全谷物和足够的水分。</p></div><div class="grid"><div class="card"><h2>🍳 好吃又方便</h2><ul><li>鸡蛋 + 全麦面包 + 水果</li><li>鸡胸/鱼 + 大量蔬菜 + 米饭</li><li>无糖酸奶 + 水果 + 坚果</li><li>豆腐/豆浆 + 蔬菜 + 主食</li></ul></div><div class="card"><h2>🌸 记录原则</h2><p>不要因为一天吃多了就惩罚自己。把下一餐恢复到正常、均衡的饮食即可。</p></div></div><div class="card"><h2>📝 我的食谱</h2><textarea id="recipe" rows="6" placeholder="写下你喜欢的减脂食谱……">${esc(data.recipe||'')}</textarea><div class="actions"><button class="btn" onclick="data.recipe=document.getElementById('recipe').value;localStorage.setItem(KEY,JSON.stringify(data));toast('食谱已保存')">保存</button></div></div></section>`}
function latestWeight(){return data.weights.length?data.weights[data.weights.length-1].weight:''}
function lostKg(){let a=+data.profile.initialWeight,w=+latestWeight();return a&&w?(a-w).toFixed(1):'0.0'}
function waterToday(){return data.water.filter(x=>x.date===today()).length}
function exerciseToday(){return Object.values(data.exercise).filter(x=>x.date===today()).length}
function mealToday(){return Object.values(data.meal).filter(x=>x.date===today()&&x.done).length}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveProfile(){data.profile.nickname=document.getElementById('nickname').value;data.profile.height=document.getElementById('height').value;data.profile.initialWeight=document.getElementById('initialWeight').value;data.profile.targetWeight=document.getElementById('targetWeight').value;save();toast('资料已保存')}
function addWeight(){let d=document.getElementById('wdate').value||today(),w=+document.getElementById('wval').value;if(!w)return toast('请输入体重');let old=data.weights.find(x=>x.date===d);if(old)old.weight=w;else data.weights.push({date:d,weight:w});let f=document.getElementById('wphoto');save();if(f.files[0])savePhoto('weight',d,f.files[0]);toast('体重已保存')}
function addDrink(kind){data.water.push({date:today(),kind});save();toast('饮水已记录')}
function openExercise(i){let v=vids[i],done=data.exercise[i]?.date===today();openModal(`<h2>${v[0]}</h2><p>${v[1]?'<a target="_blank" rel="noopener" href="'+v[1]+'">▶ 打开 YouTube 视频</a>':'这个条目的 YouTube 链接缺失，请稍后补充。'}</p><div class="card"><h3>今日打卡</h3><label class="check"><input type="checkbox" ${done?'checked':''} onchange="toggleExercise(${i},this.checked)"><span>我完成了今天的运动</span></label></div><button class="btn light" onclick="closeModal()">返回</button>`)}
function toggleExercise(i,on){if(on){data.exercise[i]={date:today()};data.history.push({date:today(),day:'—',type:'运动 '+(i+1)})}else delete data.exercise[i];save();toast(on?'运动已打卡':'已取消')}
function toggleMeal(key,day,on){data.meal[key]={date:today(),day,done:on};if(on)data.history.push({date:today(),day,type:key.startsWith('fast3')?'3天清肠模板':'长期计划'});save();toast(on?'打卡完成':'已取消')}
function openCustomPlan(){openModal(`<h2>🌷 21 天打卡模板</h2><p>建议把它当作记录框架，而不是强制减重处方。每天按你的实际饮食记录。</p>${Array.from({length:21},(_,i)=>`<div class="check"><input type="checkbox" ${data.meal['day'+(i+1)]?.done?'checked':''} onchange="toggleMeal('day${i+1}',${i+1},this.checked)"><span><b>Day ${i+1}</b><br><small>今日饮食完成记录</small></span><label class="btn light" style="margin-left:auto">📷<input type="file" accept="image/*" hidden onchange="saveMealPhoto('day${i+1}',this.files[0])"></label></div>`).join('')}`)}
function openModal(s){document.getElementById('modalBody').innerHTML=s;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function drawChart(){let c=document.getElementById('chart');if(!c)return;let arr=data.weights.slice(-14);if(!arr.length){c.innerHTML='<p style="margin:auto;color:#7895a2">记录几天体重后，这里会显示趋势。</p>';return}let vals=arr.map(x=>+x.weight),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;c.innerHTML=arr.map(x=>{let h=30+((x.weight-min)/range)*110;return `<div class="barcol"><small>${x.weight}</small><div class="bar" style="height:${h}px"></div><small>${x.date.slice(5)}</small></div>`}).join('')}
function savePhoto(kind,key,file){if(!file)return;let r=new FileReader();r.onload=()=>{let req=indexedDB.open(DB,1);req.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=e=>{let db=e.target.result,tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:kind+'-'+key,kind,key,data:r.result,date:key});tx.oncomplete=()=>{toast('照片已保存');renderPhotos()}}}}
function saveMealPhoto(key,file){savePhoto('meal',key,file)}
function renderPhotos(){let box=document.getElementById('weightPhotos');if(!box)return;let req=indexedDB.open(DB,1);req.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=e=>{let db=e.target.result,tx=db.transaction(STORE,'readonly'),rq=tx.objectStore(STORE).getAll();rq.onsuccess=()=>{box.innerHTML=rq.result.filter(x=>x.kind==='weight').sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="photo"><img src="${x.data}"><span>${x.date}</span></div>`).join('')||'<p>还没有照片。</p>'}}}
function attach(){renderPhotos()}
document.getElementById('menu').onclick=()=>document.querySelector('.side').classList.toggle('open');
for(let i=0;i<22;i++){let f=document.createElement('span');f.className='flake';f.textContent='❄';f.style.left=Math.random()*100+'%';f.style.animationDuration=(7+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*15)+'s';f.style.fontSize=(9+Math.random()*10)+'px';document.getElementById('snow').appendChild(f)}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
